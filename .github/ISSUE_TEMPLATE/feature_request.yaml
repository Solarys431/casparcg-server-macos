name: Suggestion
description: An idea for CasparCG Server for macOS
labels:
  - type/enhancement

body:
  - type: markdown
    attributes:
      value: |
        Thank you. Before posting, search the [existing suggestions](https://github.com/Solarys431/casparcg-server-macos/issues?q=is%3Aissue+label%3Atype%2Fenhancement)
        and read the [roadmap](https://github.com/Solarys431/casparcg-server-macos#roadmap). An idea for CasparCG on every system belongs
        [upstream](https://github.com/CasparCG/server/issues).

  - type: textarea
    attributes:
      label: What it should do
      description: The need, as it shows up in your work (a show, a workflow, a piece of hardware).
    validations:
      required: true

  - type: textarea
    attributes:
      label: How it could work
      description: If you have an idea of the solution, or of how other software does it.
