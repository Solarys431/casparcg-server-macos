<!doctype html>
<html><head><meta charset="utf-8"><style>
  :root { --rack:#0c0e11; --pannello:#15181d; --filo:#2a2f37; --testo:#eceef1; --fioco:#8b929b;
          --rosso:#e5332a; --verde:#2db36b; --ambra:#f2a93b; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 400px; background: var(--rack); color: var(--testo); overflow: hidden;
         font-family: "Avenir Next", sans-serif; position: relative; }
  body::before { content: ""; position: absolute; inset: 0;
    background: radial-gradient(900px 420px at 78% 50%, #1b212a 0%, transparent 70%),
                repeating-linear-gradient(0deg, #ffffff05 0 1px, transparent 1px 4px); }
  .testo { position: absolute; left: 72px; top: 54px; width: 560px; }
  .riga { display: flex; align-items: center; gap: 12px; font: 600 13px "SF Mono", monospace; letter-spacing: .18em;
          color: var(--fioco); text-transform: uppercase; }
  .lampada { width: 10px; height: 10px; border-radius: 50%; background: var(--rosso); box-shadow: 0 0 14px var(--rosso); }
  h1 { font: 700 90px/0.86 "DIN Condensed", sans-serif; letter-spacing: .01em; text-transform: uppercase; margin-top: 22px; }
  h1 span { display: block; font: 500 46px/1.1 "Avenir Next", sans-serif; letter-spacing: -.01em; text-transform: none;
            color: #c9ced5; margin-top: 6px; }
  .tecnica { margin-top: 20px; font: 500 13.5px/1.7 "SF Mono", monospace; color: var(--fioco); letter-spacing: .02em; }
  .tecnica b { color: var(--testo); font-weight: 600; }
  .muro { position: absolute; right: 64px; top: 52px; width: 560px; display: grid; grid-template-columns: 2fr 1fr;
          grid-template-rows: 1fr 1fr; gap: 10px; height: 296px; }
  .monitor { background: #050607; border: 1px solid var(--filo); border-radius: 6px; position: relative; overflow: hidden; }
  .monitor .etichetta { position: absolute; left: 8px; top: 7px; font: 700 13px "DIN Condensed", sans-serif;
          letter-spacing: .12em; color: #fff; text-shadow: 0 1px 2px #000; z-index: 2; }
  .pgm { grid-row: 1 / 3; border: 2px solid var(--rosso); box-shadow: 0 0 22px #e5332a40; }
  .pvw { border: 2px solid var(--verde); }
  .barre { position: absolute; inset: 0; display: grid; grid-template-rows: 67% 8% 25%; }
  .fila { display: grid; grid-template-columns: repeat(7, 1fr); }
  .fila.alta div:nth-child(1){background:#c0c0c0}.fila.alta div:nth-child(2){background:#c0c000}
  .fila.alta div:nth-child(3){background:#00c0c0}.fila.alta div:nth-child(4){background:#00c000}
  .fila.alta div:nth-child(5){background:#c000c0}.fila.alta div:nth-child(6){background:#c00000}
  .fila.alta div:nth-child(7){background:#0000c0}
  .fila.media div:nth-child(1){background:#0000c0}.fila.media div:nth-child(2){background:#131313}
  .fila.media div:nth-child(3){background:#c000c0}.fila.media div:nth-child(4){background:#131313}
  .fila.media div:nth-child(5){background:#00c0c0}.fila.media div:nth-child(6){background:#131313}
  .fila.media div:nth-child(7){background:#c0c0c0}
  .bassa { display: grid; grid-template-columns: 5fr 5fr 5fr 3fr 1fr 1fr 1fr 4fr; }
  .bassa div:nth-child(1){background:#00214c}.bassa div:nth-child(2){background:#fff}.bassa div:nth-child(3){background:#32006a}
  .bassa div:nth-child(4){background:#131313}.bassa div:nth-child(5){background:#090909}.bassa div:nth-child(6){background:#131313}
  .bassa div:nth-child(7){background:#1d1d1d}.bassa div:nth-child(8){background:#131313}
  .sottopancia { position: absolute; left: 22px; bottom: 30px; z-index: 2; display: flex; flex-direction: column; }
  .sottopancia .tag { align-self: flex-start; background: var(--rosso); font: 700 11px "DIN Condensed", sans-serif;
          letter-spacing: .14em; padding: 3px 7px 1px; }
  .sottopancia .nome { background: linear-gradient(180deg,#1f242b,#0e1115); border-left: 4px solid var(--rosso);
          padding: 7px 18px 6px 12px; box-shadow: 0 6px 18px #000a; }
  .sottopancia .nome b { display: block; font: 700 26px/1 "DIN Condensed", sans-serif; letter-spacing: .02em; }
  .sottopancia .nome i { display: block; font: 500 10px "Avenir Next", sans-serif; font-style: normal; letter-spacing: .16em;
          color: #aab1ba; text-transform: uppercase; margin-top: 3px; }
  .sfumato { position: absolute; inset: 0; }
  .pvw .sfumato { background: radial-gradient(circle at 30% 40%, #2b5a8a, #0b1a2c 70%); }
  .metro { position: absolute; right: 10px; top: 28px; bottom: 10px; width: 18px; display: flex; gap: 3px; z-index: 2; }
  .metro div { flex: 1; background: linear-gradient(0deg, var(--verde) 0 62%, var(--ambra) 62% 82%, var(--rosso) 82% 88%, #1a1d22 88%); border-radius: 1px; }
  .metro div + div { background: linear-gradient(0deg, var(--verde) 0 55%, var(--ambra) 55% 74%, #1a1d22 74%); }
  .codice { position: absolute; left: 10px; right: 10px; bottom: 10px; font: 500 10.5px/1.5 "SF Mono", monospace; color: #7fd9c9; z-index: 2; }
</style></head><body>
  <div class="testo">
    <div class="riga"><span class="lampada"></span>Unofficial port · Apple Silicon</div>
    <h1>CasparCG Server<span>for macOS</span></h1>
    <div class="tecnica"><b>Vulkan</b> on KosmicKrisp &amp; MoltenVK<br><b>VideoToolbox</b> · <b>CEF 150</b> · <b>FFmpeg 8.1</b></div>
  </div>
  <div class="muro">
    <div class="monitor pgm">
      <span class="etichetta">PGM · CH 1</span>
      <div class="barre"><div class="fila alta"><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
        <div class="fila media"><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
        <div class="bassa"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div></div>
      <div class="sottopancia"><span class="tag">● ON AIR</span><div class="nome"><b>VULKAN MIXER</b><i>KosmicKrisp · MoltenVK</i></div></div>
    </div>
    <div class="monitor pvw"><span class="etichetta">PVW · CH 1</span><div class="sfumato"></div>
      <div class="metro"><div></div><div></div></div></div>
    <div class="monitor"><span class="etichetta">AMCP · 5250</span>
      <div class="codice">&gt; PLAY 1-10 CLIP LOOP<br>202 PLAY OK<br>&gt; CG 1-20 ADD 0 LOWER 1<br>202 CG OK</div></div>
  </div>
</body></html>
